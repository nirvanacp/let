# Reusable workflow for applet repositories: installs the repository's tools with npm ci,
# rebuilds every applet with the tools and Node versions its published release record names, and
# fails unless the rebuild equals the committed build.
# Callers: factory/applets/templates/github/genesis-check.yml.
name: Let applet check

on:
  workflow_call:
    inputs:
      servelets-repository:
        description: The repository that holds the servelets of the applets' local services, as owner/name. Leave empty when no applet has one.
        type: string
        default: ""
      servelets-ref:
        description: The full commit sha of servelets-repository to build the servelets from.
        type: string
        default: ""
      go-version:
        description: The exact Go version that builds the servelets, such as 1.26.2. Required with servelets-repository.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: List applets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node matches `engines` in the repository's package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Use the npm that packageManager names
        run: |
          manager="$(node -p 'require("./package.json").packageManager ?? ""')"
          if [ -n "$manager" ]; then npm install -g "$manager"; fi
      - run: npm ci --no-audit --no-fund
      - id: plan
        run: npx let-applet ci plan --source .

  verify:
    name: Verify ${{ matrix.applet.appletId }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        applet: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      APPLET_ID: ${{ matrix.applet.appletId }}
      APPLET_PATH: ${{ matrix.applet.path }}
      SERVELETS: ${{ inputs.servelets-repository }}
    steps:
      - name: Require a published release
        if: ${{ !matrix.applet.tools }}
        run: |
          echo "::error::$APPLET_PATH/published has no release record of $APPLET_ID. Run let-applet publish and commit published/."
          exit 1
      - name: Require the servelet inputs together
        if: ${{ inputs.servelets-repository != '' && (inputs.servelets-ref == '' || inputs.go-version == '') }}
        run: |
          echo "::error::servelets-repository needs servelets-ref and go-version."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - if: ${{ inputs.servelets-repository != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.servelets-repository }}
          ref: ${{ inputs.servelets-ref }}
          path: servelets
          persist-credentials: false
      # The servelet's WebAssembly module must rebuild byte for byte, so Go is the exact version.
      - if: ${{ inputs.servelets-repository != '' }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: false
          cache: false
      # The Node version the release record names; ci verify fails on any other.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.applet.node }}
      - name: Use the npm that packageManager names
        working-directory: source
        run: |
          manager="$(node -p 'require("./package.json").packageManager ?? ""')"
          if [ -n "$manager" ]; then npm install -g "$manager"; fi
      - working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Rebuild and compare
        working-directory: source
        run: npx let-applet ci verify --source . --path "$APPLET_PATH" ${SERVELETS:+--servelets ../servelets}
