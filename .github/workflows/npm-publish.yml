# Publishes the four framework packages to npm when a `v<version>` tag is pushed. The tag must
# equal FRAMEWORK_VERSION in packages/core/src/compat.ts and the version of every package.
# A publish is permanent: the job stops at the first failure, and a rerun skips each package
# whose version is already on npm.
name: Publish npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node and npm match `engines` in package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.14.1
      # The repository has no lockfile; its third-party dependencies are pinned exactly.
      - run: npm install --no-audit --no-fund
      - name: Check the tag against the versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const version = process.env.TAG.replace(/^v/, "");
            const problems = [];
            const compat = "packages/core/src/compat.ts";
            const framework = readFileSync(compat, "utf8").match(/export const FRAMEWORK_VERSION = "([^"]+)"/)?.[1];
            if (framework !== version) problems.push(`${compat}: FRAMEWORK_VERSION is ${framework}`);
            for (const name of ["core", "sdk", "applet-tools", "servelet-tools"]) {
              const file = `packages/${name}/package.json`;
              const json = JSON.parse(readFileSync(file, "utf8"));
              if (json.version !== version) problems.push(`${file}: version is ${json.version}`);
            }
            if (problems.length > 0) {
              console.error(`Tag ${process.env.TAG} does not match version ${version}:\n${problems.join("\n")}`);
              process.exit(1);
            }
          '
      - run: npm run typecheck
      - run: npm test -w packages/core -w packages/sdk
      # Dependency order: core first, then the packages that depend on it.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for name in core servelet-tools sdk applet-tools; do
            package="@nirvanacp/$name"
            if [ "$(npm view "$package@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$package@$version is already on npm; skipping."
              continue
            fi
            npm publish -w "packages/$name" --provenance --access public --tag latest
          done
