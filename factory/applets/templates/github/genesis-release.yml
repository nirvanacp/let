# Copy to .github/workflows/genesis-release.yml in your applet repository.
# Replace <let-sha> with a full commit sha of the Let repository (nirvanacp/let) that is on GitHub.
# A tag v<version> (single-applet repository) or <id>/v<version> (multi-applet repository)
# rebuilds the applet with the tools and Node versions its release record names, compares it with
# the committed build and publishes a GitHub Release with the bundle, its release record and
# build provenance attestations.
name: Genesis release

on:
  push:
    tags: ['v*', '*/v*']

permissions:
  contents: read

jobs:
  release:
    uses: nirvanacp/let/.github/workflows/applet-release.yml@<let-sha>
    # Only when an applet has a local service: the repository and full commit sha that hold its
    # servelets, and the exact Go version that built them (go version).
    # with:
    #   servelets-repository: <owner/name>
    #   servelets-ref: <servelets-sha>
    #   go-version: <go-version>
    permissions:
      contents: write
      id-token: write
      attestations: write
